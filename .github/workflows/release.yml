name: Attach release assets

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: shadow-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match existing release tag to both manifests
        run: python -X utf8 scripts/validate_plugin.py --tag "$RELEASE_TAG"
      - name: Test source and packaging
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Build both ZIP names and checksums
        run: python -X utf8 scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Attach assets to this existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/shadow-$RELEASE_TAG.zip" dist/shadow.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
