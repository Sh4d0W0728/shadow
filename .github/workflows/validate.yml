name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source and references
        run: python -X utf8 scripts/validate_plugin.py
      - name: Test packaging and rejection cases
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Build distributable archive
        run: python -X utf8 scripts/build_release.py
